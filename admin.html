<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Xeno Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="logo.png" type="image/png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0a0a0a',
                        darkCard: '#141414',
                        darkBorder: '#262626',
                        xenoRed: '#dc2626',
                        xenoRedHover: '#b91c1c',
                        xenoYellow: '#eab308',
                        xenoYellowHover: '#ca8a04'
                    },
                    fontFamily: {
                        heading: ['Orbitron', 'sans-serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0a; color: #f3f4f6; font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-heading { font-family: 'Orbitron', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #141414; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen bg-darkBg custom-scrollbar">

<!-- Admin Header -->
<header class="bg-darkCard border-b border-darkBorder sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <img src="logo.png" alt="Xeno Store Logo" class="w-10 h-10 rounded-lg object-cover border border-xenoYellow/40 shadow-lg">
            <div>
                <span class="font-heading text-lg font-bold text-white">Xeno<span class="text-xenoYellow">Store</span></span>
                <span class="text-[10px] bg-xenoYellow/20 text-xenoYellow border border-xenoYellow/30 px-2 py-0.5 rounded ml-2">Admin Panel</span>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <a href="index.html" target="_blank" class="text-xs text-gray-400 hover:text-xenoYellow flex items-center gap-1.5 transition-colors">
                <i class="fa-solid fa-store"></i>
                <span>Buka Store</span>
            </a>
        </div>
    </div>
</header>


    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        <!-- Dashboard Overview -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-darkCard border border-darkBorder p-5 rounded-xl flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-semibold">Total Akun</p>
                    <h3 class="text-2xl font-black font-heading text-white mt-1" id="statTotal">0</h3>
                </div>
                <div class="w-12 h-12 bg-blue-500/10 text-blue-500 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
            </div>
            <div class="bg-darkCard border border-darkBorder p-5 rounded-xl flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-semibold">Akun Ready</p>
                    <h3 class="text-2xl font-black font-heading text-green-400 mt-1" id="statReady">0</h3>
                </div>
                <div class="w-12 h-12 bg-green-500/10 text-green-500 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-check-circle"></i>
                </div>
            </div>
            <div class="bg-darkCard border border-darkBorder p-5 rounded-xl flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-semibold">Akun Terjual</p>
                    <h3 class="text-2xl font-black font-heading text-xenoRed mt-1" id="statSold">0</h3>
                </div>
                <div class="w-12 h-12 bg-xenoRed/10 text-xenoRed rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-handshake"></i>
                </div>
            </div>
        </div>

        <!-- Add/Edit Form -->
        <div class="bg-darkCard border border-darkBorder rounded-2xl p-6 shadow-xl">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-darkBorder">
                <h2 class="font-heading text-lg font-bold text-white flex items-center gap-2" id="formHeaderTitle">
                    <i class="fa-solid fa-circle-plus text-xenoYellow"></i> Tambah Akun Baru
                </h2>
                <button id="cancelEditBtn" onclick="window.resetForm()" class="hidden text-xs text-gray-400 hover:text-white bg-darkBg px-3 py-1.5 rounded border border-darkBorder">
                    Batal Edit
                </button>
            </div>

            <form id="accountForm" class="space-y-4">
                <input type="hidden" id="accId">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 font-semibold mb-1">Kode Akun *</label>
                        <input type="text" id="accCode" required placeholder="Contoh: XENO-001" class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-xenoRed">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs text-gray-400 font-semibold mb-1">Judul / Highlight Utama *</label>
                        <input type="text" id="accTitle" required placeholder="Mythic Glory - Spek Heroic & Ex-Global" class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-xenoRed">
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 font-semibold mb-1">Rank *</label>
                        <select id="accRank" required class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-xenoRed">
                            <option value="Mythic Immortal">Mythic Immortal</option>
                            <option value="Mythic Glory">Mythic Glory</option>
                            <option value="Mythic Honor">Mythic Honor</option>
                            <option value="Mythic">Mythic</option>
                            <option value="Legend">Legend</option>
                            <option value="Epic">Epic</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 font-semibold mb-1">Harga (Rp) *</label>
                        <input type="number" id="accPrice" required placeholder="500000" class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-xenoRed">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 font-semibold mb-1">Jumlah Skin *</label>
                        <input type="number" id="accSkins" required placeholder="95" class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-xenoRed">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 font-semibold mb-1">Jumlah Hero *</label>
                        <input type="number" id="accHeroes" required placeholder="85" class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-xenoRed">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 font-semibold mb-1">Winrate (%)</label>
                        <input type="text" id="accWinrate" placeholder="60.5%" class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-xenoRed">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 font-semibold mb-1">Tipe Login *</label>
                        <select id="accLogin" required class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-xenoRed">
                            <option value="Moonton Sepaket (Monsep)">Moonton Sepaket (Monsep)</option>
                            <option value="VK Only">VK Only</option>
                            <option value="Moonton Unbind All">Moonton Unbind All</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 font-semibold mb-1">Status Stock</label>
                        <select id="accStatus" class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-xenoRed">
                            <option value="Ready">Ready</option>
                            <option value="Terjual">Terjual</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 font-semibold mb-1">URL Gambar / Thumbnail Card *</label>
                    <input type="url" id="accImage" required placeholder="https://images.unsplash.com/..." class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-xenoRed">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 font-semibold mb-1">Deskripsi & Rincian Akun</label>
                    <textarea id="accDesc" rows="3" placeholder="Tuliskan detail skin, hero, dan kelengkapan akun..." class="w-full bg-darkBg border border-darkBorder rounded-lg p-3 text-sm text-white focus:outline-none focus:border-xenoRed custom-scrollbar"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" id="submitBtn" class="w-full sm:w-auto px-6 py-2.5 bg-xenoRed hover:bg-xenoRedHover text-white font-bold text-xs rounded-lg transition-all shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>Simpan ke Database</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Inventory Table -->
        <div class="bg-darkCard border border-darkBorder rounded-2xl overflow-hidden shadow-xl">
            <div class="p-5 border-b border-darkBorder flex items-center justify-between">
                <h2 class="font-heading text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-xenoYellow"></i> Kelola Inventaris Data
                </h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-darkBg text-xs uppercase text-gray-400 border-b border-darkBorder">
                        <tr>
                            <th class="p-4">Thumbnail</th>
                            <th class="p-4">Kode & Info</th>
                            <th class="p-4">Rank</th>
                            <th class="p-4">Harga</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y divide-darkBorder">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmmCkWLpomo_2Nva36fugGvsO1gRXCDIk",
            authDomain: "xeno-store-b7945.firebaseapp.com",
            projectId: "xeno-store-b7945",
            storageBucket: "xeno-store-b7945.firebasestorage.app",
            messagingSenderId: "468587782142",
            appId: "1:468587782142:web:963527c748f1c80d036aaf",
            measurementId: "G-M30RSVQSRP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ADMIN_PIN = "xeno291026"; // PIN Rahasia Admin

        // Proteksi PIN Admin
        if (sessionStorage.getItem('xeno_admin_auth') !== 'true') {
            const pin = prompt("Masukkan PIN Akses Admin Xeno Store:");
            if (pin === ADMIN_PIN) {
                sessionStorage.setItem('xeno_admin_auth', 'true');
            } else {
                alert("PIN Salah! Akses ditolak.");
                window.location.href = "index.html";
            }
        }

        let adminAccounts = [];

        async function loadAdminData() {
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-400"><i class="fa-solid fa-circle-notch fa-spin text-xenoRed mr-2"></i> Mengambil data dari Firebase...</td></tr>`;
            
            try {
                const querySnapshot = await getDocs(collection(db, "accounts"));
                adminAccounts = [];
                querySnapshot.forEach((docSnap) => {
                    adminAccounts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderAdminTable();
            } catch (err) {
                console.error("Error:", err);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-xenoRed">Gagal memuat data dari Firestore. Periksa aturan (Rules) Firestore Anda.</td></tr>`;
            }
        }

        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
        }

        function renderAdminTable() {
            document.getElementById('statTotal').innerText = adminAccounts.length;
            document.getElementById('statReady').innerText = adminAccounts.filter(a => a.status === 'Ready').length;
            document.getElementById('statSold').innerText = adminAccounts.filter(a => a.status === 'Terjual').length;

            const tbody = document.getElementById('adminTableBody');
            if(adminAccounts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-500">Belum ada akun terdaftar di database.</td></tr>`;
                return;
            }

            tbody.innerHTML = adminAccounts.map(acc => `
                <tr class="hover:bg-darkBg/50 transition-colors">
                    <td class="p-4">
                        <img src="${acc.image || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80'}" class="w-16 h-10 object-cover rounded border border-darkBorder">
                    </td>
                    <td class="p-4">
                        <div class="font-heading text-xs font-bold text-xenoYellow">${acc.code}</div>
                        <div class="font-bold text-white text-xs line-clamp-1 mt-0.5">${acc.title}</div>
                    </td>
                    <td class="p-4 text-xs text-gray-300 font-semibold">${acc.rank}</td>
                    <td class="p-4 text-xs font-bold text-xenoYellow">${formatRupiah(acc.price)}</td>
                    <td class="p-4">
                        <button onclick="window.toggleStatus('${acc.id}')" class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase border cursor-pointer ${acc.status === 'Ready' ? 'bg-green-500/10 border-green-500/30 text-green-400' : 'bg-red-500/10 border-red-500/30 text-red-400'}">
                            ${acc.status}
                        </button>
                    </td>
                    <td class="p-4 text-center">
                        <div class="flex items-center justify-center space-x-2">
                            <button onclick="window.editAccount('${acc.id}')" class="p-1.5 bg-darkBg hover:bg-xenoYellow hover:text-black text-xenoYellow border border-xenoYellow/30 rounded transition-colors" title="Edit">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="window.deleteAccount('${acc.id}')" class="p-1.5 bg-darkBg hover:bg-xenoRed hover:text-white text-xenoRed border border-xenoRed/30 rounded transition-colors" title="Hapus">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('accountForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('accId').value;
            const submitBtn = document.getElementById('submitBtn');

            const newAcc = {
                code: document.getElementById('accCode').value,
                title: document.getElementById('accTitle').value,
                rank: document.getElementById('accRank').value,
                price: Number(document.getElementById('accPrice').value),
                skins: Number(document.getElementById('accSkins').value),
                heroes: Number(document.getElementById('accHeroes').value),
                winrate: document.getElementById('accWinrate').value || '0%',
                login: document.getElementById('accLogin').value,
                status: document.getElementById('accStatus').value,
                image: document.getElementById('accImage').value,
                description: document.getElementById('accDesc').value
            };

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...`;

            try {
                if (id) {
                    await updateDoc(doc(db, "accounts", id), newAcc);
                    alert("Akun berhasil diupdate!");
                } else {
                    await addDoc(collection(db, "accounts"), newAcc);
                    alert("Akun baru berhasil ditambahkan ke Firebase!");
                }
                window.resetForm();
                loadAdminData();
            } catch (err) {
                console.error("Error saving:", err);
                alert("Gagal menyimpan ke Firebase.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span>Simpan ke Firebase</span>`;
            }
        });

        window.editAccount = function(id) {
            const acc = adminAccounts.find(a => a.id === id);
            if (!acc) return;

            document.getElementById('accId').value = acc.id;
            document.getElementById('accCode').value = acc.code;
            document.getElementById('accTitle').value = acc.title;
            document.getElementById('accRank').value = acc.rank;
            document.getElementById('accPrice').value = acc.price;
            document.getElementById('accSkins').value = acc.skins;
            document.getElementById('accHeroes').value = acc.heroes;
            document.getElementById('accWinrate').value = acc.winrate;
            document.getElementById('accLogin').value = acc.login;
            document.getElementById('accStatus').value = acc.status;
            document.getElementById('accImage').value = acc.image;
            document.getElementById('accDesc').value = acc.description;

            document.getElementById('formHeaderTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-xenoYellow"></i> Edit Akun (${acc.code})`;
            document.getElementById('submitBtn').innerHTML = `<i class="fa-solid fa-rotate"></i> <span>Update Akun</span>`;
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.toggleStatus = async function(id) {
            const acc = adminAccounts.find(a => a.id === id);
            if (!acc) return;
            const newStatus = acc.status === 'Ready' ? 'Terjual' : 'Ready';
            
            try {
                await updateDoc(doc(db, "accounts", id), { status: newStatus });
                loadAdminData();
            } catch (err) {
                alert("Gagal mengubah status.");
            }
        }

        window.deleteAccount = async function(id) {
            if (confirm('Apakah Anda yakin ingin menghapus akun ini dari Firebase?')) {
                try {
                    await deleteDoc(doc(db, "accounts", id));
                    loadAdminData();
                } catch (err) {
                    alert("Gagal menghapus data.");
                }
            }
        }

        window.resetForm = function() {
            document.getElementById('accountForm').reset();
            document.getElementById('accId').value = '';
            document.getElementById('formHeaderTitle').innerHTML = `<i class="fa-solid fa-circle-plus text-xenoYellow"></i> Tambah Akun Baru`;
            document.getElementById('submitBtn').innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span>Simpan ke Firebase</span>`;
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        loadAdminData();
    </script>
</body>
</html>
